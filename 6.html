<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Layout</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <style>
        html, body {
            height: 100%;
        }
             .site-header {
            min-height: 64px;
            margin: 0;
            padding: 18px 24px;
            border-radius: 0;
            background: #f3f706;
            color: #f10808;
            font-size: 20px;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>
<header class="site-header"><h1>Adelio</h1></header>
<body class="bg-light p-0">

<div class="container-fluid p-0 vh-100 d-flex flex-column">
    <div class="row no-gutters flex-grow-1">
        <div class="col-md-4 h-100 d-flex flex-column">
            <div class="p-4 bg-primary text-white text-center flex-grow-1 d-flex align-items-center justify-content-center" style="border:2px solid black;">
                <h3 class="font-weight-bold m-0"></h3>
            </div>
        </div>

        <div class="col-md-4 h-100 d-flex flex-column">
            <div class="p-4 bg-warning text-center flex-grow-1 d-flex align-items-center justify-content-center" style="border:2px solid black;">
                <h3 class="font-weight-bold m-0"></h3>
            </div>
        </div>

        <div class="col-md-4 h-100 d-flex flex-column">
            <div class="p-4 text-center flex-grow-1 d-flex align-items-center justify-content-center" style="background-color: aquamarine; border:2px solid black;">
                <h3 class="font-weight-bold m-0"></h3>
            </div>
        </div>
    </div>

    <div class="row no-gutters flex-grow-1">
        <div class="col-md-4 h-100 d-flex flex-column">
            <div class="p-4 bg-danger text-white text-center flex-grow-1 d-flex align-items-center justify-content-center" style="border:2px solid black;">
                <h3 class="font-weight-bold m-0"></h3>
            </div>
        </div>

        <div class="col-md-4 h-100 d-flex flex-column">
            <div class="p-4 bg-info text-white text-center flex-grow-1 d-flex align-items-center justify-content-center" style="border:2px solid black;">
                <h3 class="font-weight-bold m-0"></h3>
            </div>
        </div>

        <div class="col-md-4 h-100 d-flex flex-column">
            <div class="p-4 bg-dark text-white text-center flex-grow-1 d-flex align-items-center justify-content-center" style="border:2px solid black;">
                <h3 class="font-weight-bold m-0"></h3>
            </div>
        </div>
    </div>
</div>

</body>
</html>
