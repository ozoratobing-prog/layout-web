<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            background-color: #f8f9fa;
        }

        .layout-grid {
            display: grid;
            height: calc(100vh - 80px);
            padding: 0;
            gap: 6px;
            overflow: hidden;
            box-sizing: border-box;
        }

        .panel {
            border: 2px solid black;
            padding: 20px;
            box-sizing: border-box;
        }

        .panel-red {
            grid-column: 1 / span 3;
            grid-row: 1;
            background-color: #ea0404;
        }

        .panel-blue {
            grid-column: 4 / span 2;
            grid-row: 1 / span 3;
            background-color: #0b81e1;
        }

        .panel-yellow {
            grid-column: 2 / span 2;
            grid-row: 2 / span 2;
            background-color: #efeb0c;
        }

        .panel-green {
            grid-column: 1;
            grid-row: 2 / span 4;
            background-color: #07fc2f;
        }

        .panel-purple {
            grid-column: 2 / span 4;
            grid-row: 4 / span 2;
            background-color: #bf08ed;
        }
    </style>
</head>
<body>
    <header class="bg-warning text-danger text-center" style="height: 80px; padding: 15px">
        <h1 class="m-0">header</h1>
    </header>
    <main class="container-fluid p-0">
        <div class="layout-grid">
            <div class="panel panel-red text-white"><h1>pertama</h1></div>
            <div class="panel panel-blue text-white"><h1>kedua</h1></div>
            <div class="panel panel-yellow text-white"><h1>ketiga</h1></div>
            <div class="panel panel-green text-white"><h1>keempat</h1></div>
            <div class="panel panel-purple text-white"><h1>kelima</h1></div>
        </div>
    </main>
    
</body>
</html>
