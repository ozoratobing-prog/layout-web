<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F Layout</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f4f4;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #f4d700;
            color: #d91f26;
            text-align: center;
            padding: 18px 20px;
            border-bottom: 3px solid #000;
        }

        header h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: bold;
        }

        .f-layout {
            display: grid;
            grid-template-columns: 220px 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 0;
            width: 100%;
            height: calc(100vh - 74px);
            padding: 0;
            margin: 0;
        }

        .panel {
            border: 3px solid #000;
            border-top: 0;
            border-left: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav {
            grid-column: 1;
            grid-row: 1 / span 3;
            background: #19d55c;
            border-right: 3px solid #000;
        }

        .top {
            grid-column: 2;
            grid-row: 1;
            background: #fe1a1a;
        }

        .middle {
            grid-column: 2;
            grid-row: 2;
            background: #ffbf00;
        }

        .bottom {
            grid-column: 2;
            grid-row: 3;
            background: #8e44fd;
        }

        @media (max-width: 768px) {
            .f-layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
                height: auto;
            }

            .nav,
            .top,
            .middle,
            .bottom {
                grid-column: auto;
                grid-row: auto;
                min-height: 140px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>header</h1>
    </header>

    <main class="f-layout">
        <div class="panel nav"></div>
        <div class="panel top"></div>
        <div class="panel middle"></div>
        <div class="panel bottom"></div>
    </main>
</body>
</html>
